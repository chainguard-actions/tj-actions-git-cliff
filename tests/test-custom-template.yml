name: Test custom template config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create conventional commits for changelog
        run: |
          git commit --allow-empty -m "feat: add custom template test feature"
          git commit --allow-empty -m "fix: fix something for custom template test"

      - name: Pre-install git-cliff
        run: |
          # Pre-install git-cliff binary so setup-bin can find or reuse it
          CLIFF_VERSION="2.4.0"
          ARCH="x86_64-unknown-linux-musl"
          URL="https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION}-${ARCH}.tar.gz"
          echo "Downloading git-cliff ${CLIFF_VERSION}..."
          curl -sSL "$URL" -o /tmp/git-cliff.tar.gz
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          sudo install -m 755 /tmp/git-cliff-${CLIFF_VERSION}/git-cliff /usr/local/bin/git-cliff
          echo "git-cliff version: $(git-cliff --version)"

      - id: action
        uses: .
        with:
          args: "--verbose"
          output: "CUSTOM_TEMPLATE_HISTORY.md"
          template-config: "${{ github.workspace }}/tests/fixtures/cliff-custom.toml"

      - name: Assert output file exists
        run: |
          echo "Checking if CUSTOM_TEMPLATE_HISTORY.md was created..."
          if [ ! -f "CUSTOM_TEMPLATE_HISTORY.md" ]; then
            echo "FAIL: CUSTOM_TEMPLATE_HISTORY.md was not created"
            exit 1
          fi
          echo "PASS: CUSTOM_TEMPLATE_HISTORY.md exists"

      - name: Assert output file has content
        run: |
          echo "Checking CUSTOM_TEMPLATE_HISTORY.md content..."
          CONTENT=$(cat CUSTOM_TEMPLATE_HISTORY.md)
          echo "Content: $CONTENT"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: CUSTOM_TEMPLATE_HISTORY.md is empty"
            exit 1
          fi
          echo "PASS: CUSTOM_TEMPLATE_HISTORY.md has content"

      - name: Assert custom header is present
        run: |
          echo "Checking for custom header in output..."
          if ! grep -q "My Custom Changelog" CUSTOM_TEMPLATE_HISTORY.md; then
            echo "FAIL: custom header 'My Custom Changelog' not found in output"
            cat CUSTOM_TEMPLATE_HISTORY.md
            exit 1
          fi
          echo "PASS: custom header found"
