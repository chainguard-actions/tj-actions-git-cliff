name: Test custom output file
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run git-cliff action with custom output file
        id: action
        uses: .
        with:
          output: CHANGELOG.md
          token: ${{ github.token }}

      - name: Assert CHANGELOG.md was created
        run: |
          echo "Checking for CHANGELOG.md..."
          if [ ! -f "CHANGELOG.md" ]; then
            echo "FAIL: CHANGELOG.md was not created"
            exit 1
          fi
          echo "PASS: CHANGELOG.md exists"

      - name: Assert CHANGELOG.md has content
        run: |
          echo "Contents of CHANGELOG.md:"
          cat CHANGELOG.md
          SIZE=$(wc -c < CHANGELOG.md)
          echo "File size: $SIZE bytes"
          if [ "$SIZE" -eq 0 ]; then
            echo "FAIL: CHANGELOG.md is empty"
            exit 1
          fi
          echo "PASS: CHANGELOG.md has content"

      - name: Assert cliff.toml was cleaned up
        run: |
          if [ -f "cliff.toml" ]; then
            echo "FAIL: cliff.toml was not cleaned up"
            exit 1
          fi
          echo "PASS: cliff.toml was cleaned up"
