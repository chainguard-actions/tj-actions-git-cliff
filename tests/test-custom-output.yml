name: Test custom output file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user and create a test commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a conventional commit so git-cliff has something to process
          echo "test content $(date +%s)" > test-release-file.txt
          git add test-release-file.txt
          git commit -m "feat: add test file for release notes"
          # Create the docs directory for the custom output path
          mkdir -p docs

      - name: Run git-cliff action with custom output file
        id: action
        uses: .
        with:
          args: "--verbose --unreleased"
          output: "docs/RELEASES.md"

      - name: Assert custom output file was created
        run: |
          echo "Checking for docs/RELEASES.md..."
          if [ ! -f "docs/RELEASES.md" ]; then
            echo "FAIL: docs/RELEASES.md was not created"
            exit 1
          fi
          echo "PASS: docs/RELEASES.md exists"
          echo "--- docs/RELEASES.md contents ---"
          cat docs/RELEASES.md

      - name: Assert custom output file has content
        run: |
          echo "Checking that docs/RELEASES.md has content..."
          if [ ! -s "docs/RELEASES.md" ]; then
            echo "FAIL: docs/RELEASES.md is empty"
            exit 1
          fi
          echo "PASS: docs/RELEASES.md has content"

      - name: Assert cliff.toml was cleaned up
        run: |
          echo "Checking that cliff.toml was cleaned up..."
          if [ -f "cliff.toml" ]; then
            echo "FAIL: cliff.toml was not cleaned up after action"
            exit 1
          fi
          echo "PASS: cliff.toml was cleaned up"
