name: Test custom output file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create conventional commits for changelog
        run: |
          git commit --allow-empty -m "fix: resolve a bug for testing"
          git commit --allow-empty -m "feat: add new feature for testing"

      - name: Pre-install git-cliff
        run: |
          # Pre-install git-cliff binary so setup-bin can find or reuse it
          CLIFF_VERSION="2.4.0"
          ARCH="x86_64-unknown-linux-musl"
          URL="https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION}-${ARCH}.tar.gz"
          echo "Downloading git-cliff ${CLIFF_VERSION}..."
          curl -sSL "$URL" -o /tmp/git-cliff.tar.gz
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          sudo install -m 755 /tmp/git-cliff-${CLIFF_VERSION}/git-cliff /usr/local/bin/git-cliff
          echo "git-cliff version: $(git-cliff --version)"

      - id: action
        uses: .
        with:
          args: "--verbose"
          output: "CHANGELOG_CUSTOM.md"

      - name: Assert custom output file exists
        run: |
          echo "Checking if CHANGELOG_CUSTOM.md was created..."
          if [ ! -f "CHANGELOG_CUSTOM.md" ]; then
            echo "FAIL: CHANGELOG_CUSTOM.md was not created"
            exit 1
          fi
          echo "PASS: CHANGELOG_CUSTOM.md exists"

      - name: Assert custom output file has content
        run: |
          echo "Checking CHANGELOG_CUSTOM.md content..."
          CONTENT=$(cat CHANGELOG_CUSTOM.md)
          echo "Content: $CONTENT"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: CHANGELOG_CUSTOM.md is empty"
            exit 1
          fi
          echo "PASS: CHANGELOG_CUSTOM.md has content"

      - name: Assert changelog marker is present
        run: |
          echo "Checking for changelog marker in output..."
          if ! grep -qi "changelog\|unreleased" CHANGELOG_CUSTOM.md; then
            echo "FAIL: no changelog marker found in CHANGELOG_CUSTOM.md"
            cat CHANGELOG_CUSTOM.md
            exit 1
          fi
          echo "PASS: changelog marker found"
