[changelog]
header = """
# Custom Changelog

"""
body = """
{% if version %}\
	## [{{ version | trim_start_matches(pat="v") }}] - ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
	## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
	### {{ group | upper_first }}
	{% for commit in commits %}
		- {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](REPOSITORY_URL/commit/{{ commit.id }}))
	{% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
<!-- generated by git-cliff (custom template) -->
"""

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = false
commit_parsers = [
    { message = "(?i)^feat", group = "Features"},
    { message = "(?i)^fix", group = "Bug Fixes"},
    { message = ".*", group = "Other"},
]
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "newest"
